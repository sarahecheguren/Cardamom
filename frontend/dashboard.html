<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Recipes | Cardamom</title>
    <link rel="stylesheet" href="dashboard.css" />
    <script src="dashboard.js" defer></script>
  </head>
  <body>
    <header class="dashboard-header">
      <a class="brand" href="index.html">
        Cardamom
        <span>your recipe notebook</span>
      </a>

      <nav aria-label="Main navigation">
        <span class="current-page">My Recipes</span>
        <button id="logout-button" type="button">Log out</button>
      </nav>
    </header>

    <main class="dashboard-main">
      <section class="welcome-section">
        <div>
          <p class="eyebrow">Your personal cookbook</p>
          <h1>My Recipes</h1>
          <p>Keep all your favorite recipes in one place.</p>
        </div>

        <a href="add-recipe.html" class="add-button">+ Add Recipe</a>
      </section>

      <section class="recipes-section" aria-labelledby="recipes-heading">
        <div class="section-heading">
          <h2 id="recipes-heading">Your collection</h2>
          <span id="recipe-count" class="demo-label"></span>
        </div>

        <p id="collection-message" role="status" aria-live="polite">Loading your recipes...</p>

        <div id="recipe-grid" class="recipe-grid"></div>
      </section>
    </main>

    <footer>Cardamom &middot; A place for the recipes you love.</footer>
  </body>
</html>
